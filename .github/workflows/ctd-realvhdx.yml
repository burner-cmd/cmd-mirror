name: D17 cross-tenant real VHDX (no stub)
on:
  workflow_dispatch:

jobs:
  cross:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Setup containerd + harness + create REAL VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\ctdvhd'
          $snaproot='C:\ctdpoc\root\io.containerd.snapshotter.v1.windows-lcow'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\go","$snaproot" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $gm='bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'; [IO.File]::WriteAllBytes("$base\go\go.mod",[Convert]::FromBase64String($gm))
          $src=''; [IO.File]::WriteAllBytes("$base\go\main.go",[Convert]::FromBase64String($src))
          # Create a REAL VHDX with distinctive content via diskpart (no Hyper-V needed)
          $vhdx="$snaproot\scratch.vhdx"
          $dp=@"
          create vdisk file=$vhdx maximum=64 type=expandable
          attach vdisk
          create partition primary
          format fs=ntfs quick
          assign letter=V
          exit
          "@
          $dp | Out-File -FilePath "$base\mk.txt" -Encoding ascii
          diskpart /s "$base\mk.txt" 2>&1 | Select-Object -Last 8
          Start-Sleep -Seconds 2
          Set-Content -Path 'V:\VICTIM_TENANT_SECRET.txt' -Value 'D17_REAL_VHDX_VICTIM_SECRET_4B8C' -Encoding ascii
          $detach=@"
          select vdisk file=$vhdx
          detach vdisk
          exit
          "@
          $detach | Out-File -FilePath "$base\det.txt" -Encoding ascii
          diskpart /s "$base\det.txt" 2>&1 | Select-Object -Last 5
          Get-Item $vhdx | Select-Object FullName,Length | Format-List
          $h=Get-FileHash $vhdx -Algorithm SHA256
          Write-Output "ORIGINAL_VHDX_SHA256=$($h.Hash)"

      - name: Build harness + start daemon + run
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdvhd'
          $env:GO111MODULE='on'
          Set-Location "$base\go"; go mod tidy 2>&1 | Out-Null; go build -o "$base\cross.exe" . 2>&1 | Tee-Object "$base\build.log"
          Write-Output "HARNESS_RC=$LASTEXITCODE"
          $p=Start-Process -FilePath "$base\bin\bin\containerd.exe" -ArgumentList @('--config',"$base\config.toml",'--log-level','debug') -RedirectStandardOutput "$base\stdout.log" -RedirectStandardError "$base\stderr.log" -PassThru
          Write-Output "CONTAINERD_PID=$($p.Id)"
          Start-Sleep -Seconds 8
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'windows-lcow'
          Write-Output '=== REAL VHDX CROSS-TENANT PoC ==='
          & "$base\cross.exe" 2>&1 | Tee-Object -FilePath "$base\cross.out"
          Write-Output "HARNESS_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 2
          Write-Output '=== daemon scratch branch ==='
          if (Test-Path "$base\stderr.log") { Select-String -Path "$base\stderr.log" -Pattern 'scratch|prepare snapshot' | Select-Object -Last 8 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-realvhdx-evidence
          path: |
            C:\ctdvhd\cross.out
            C:\ctdvhd\build.log
            C:\ctdvhd\stderr.log
          if-no-files-found: warn
