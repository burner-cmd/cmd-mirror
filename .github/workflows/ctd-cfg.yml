name: D17 containerd config dump
on:
  workflow_dispatch:
  push:
    branches: [cmd-bot]

jobs:
  cfg:
    runs-on: windows-latest
    steps:
      - name: Download containerd + dump default config
        shell: pwsh
        run: |
          $base='C:\ctdpoc'; New-Item -ItemType Directory -Force -Path "$base\bin" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          Write-Output '=== DEFAULT CONFIG ==='
          & "$base\bin\bin\containerd.exe" config default 2>&1 | Select-String -Pattern 'address|ttrpc|grpc|snapshotter' -Context 0,1 | Select-Object -First 60
