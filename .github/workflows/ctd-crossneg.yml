name: D17 cross-tenant NEGATIVE CONTROL
on:
  workflow_dispatch:

jobs:
  cross:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Setup containerd + stub + harness source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\ctdcross'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\root","$base\state","$base\go","$base\stub" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $gomod='bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'; [IO.File]::WriteAllBytes("$base\go\go.mod",[Convert]::FromBase64String($gomod))
          $src=''; [IO.File]::WriteAllBytes("$base\go\main.go",[Convert]::FromBase64String($src))
          $stub=''; [IO.File]::WriteAllBytes("$base\stub\main.go",[Convert]::FromBase64String($stub))
          Set-Content "$base\stub\go.mod" -Value "module stub`n`ngo 1.24" -Encoding ascii
          Write-Output 'SETUP_OK'

      - name: Build stub + harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\ctdcross'
          $env:GO111MODULE='on'
          Set-Location "$base\stub"; go build -o "$base\bin\bin\runhcs.exe" . 2>&1 | Out-Null
          Write-Output "STUB_RC=$LASTEXITCODE"
          Set-Location "$base\go"; go mod tidy 2>&1 | Out-Null; go build -o "$base\cross.exe" . 2>&1 | Tee-Object -FilePath "$base\build.log"
          Write-Output "HARNESS_RC=$LASTEXITCODE"
          Get-Item "$base\cross.exe" -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-List

      - name: Start daemon + run cross-tenant PoC
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdcross'
          $p=Start-Process -FilePath "$base\bin\bin\containerd.exe" -ArgumentList @('--config',"$base\config.toml",'--log-level','debug') -RedirectStandardOutput "$base\stdout.log" -RedirectStandardError "$base\stderr.log" -PassThru
          Write-Output "CONTAINERD_PID=$($p.Id)"
          Start-Sleep -Seconds 8
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'windows-lcow'
          Write-Output '=== RUN CROSS-TENANT HARNESS ==='
          & "$base\cross.exe" 2>&1 | Tee-Object -FilePath "$base\cross.out"
          Write-Output "HARNESS_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 3
          Write-Output '=== daemon tail ==='
          if (Test-Path "$base\stderr.log") { Get-Content "$base\stderr.log" -Tail 25 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-cross-neg-evidence
          path: |
            C:\ctdcross\cross.out
            C:\ctdcross\build.log
            C:\ctdcross\stderr.log
            C:\ctdcross\stdout.log
          if-no-files-found: warn
